name: procureflow

services:
  postgres:
    image: procureflow-postgres:0.1.0-p1
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: procureflow
      POSTGRES_USER: procureflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD for local development}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD for local development}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD for local development}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD for local development}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores versioned data below /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureflow -d procureflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: procureflow-app:0.1.0-p0
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/procureflow
      DB_USERNAME: procureflow_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD for local development}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD for local development}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/procureflow
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/procureflow/protocol/openid-connect/certs
      FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-4200},http://127.0.0.1:${FRONTEND_PORT:-4200}
      SPRING_PROFILES_ACTIVE: local-demo
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  frontend:
    image: procureflow-frontend:0.1.0-p0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # Durable publishing runtime: PostgreSQL-fenced outbox relay with bounded retry/quarantine.
  # Consumer materialization and SMTP remain later P4 slices; the queue intentionally accumulates.
  notification-worker:
    image: procureflow-notification-worker:0.1.0-p0
    profiles: ["worker"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MODULE: notification-worker
    environment:
      SERVER_PORT: 8081
      WORKER_DB_URL: jdbc:postgresql://postgres:5432/procureflow
      WORKER_DB_USERNAME: procureflow_worker
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?Set WORKER_DB_PASSWORD for local development}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: procureflow
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD for local development}
      # Unauthenticated loopback Mailpit capture; no SMTP credential or .env value is needed.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        # The application owns migrations; the worker only starts against a migrated database.
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        # Worker startup order only; the business app never depends on the worker or SMTP.
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # Local-only SMTP capture for email-job evidence. Messages live in a temporary SQLite
  # database under the tmpfs /tmp and disappear with the container: no named volume, no
  # billable storage and no secrets. The upstream UI has no authentication, so both
  # ports stay bound to loopback.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    profiles: ["worker"]
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      # Upstream image ships the same readyz probe; it is restated so the readiness
      # contract stays visible beside the pin instead of only inside the image config.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # The upstream image runs as root by default; the local capture process only needs to
    # write its temporary database under the tmpfs above.
    user: "65534:65534"

  # Durable single-broker topology; management UI is bound to loopback only.
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    profiles: ["worker"]
    environment:
      RABBITMQ_DEFAULT_USER: procureflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD for local development}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    # The upstream entrypoint drops privileges (chown/setuid); read-only rootfs or dropped
    # capabilities break its startup. Network surface stays loopback-only.
    security_opt: ["no-new-privileges:true"]

  # Local-only OIDC realm and fictional users; no real account password is committed.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD for local development}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD for local development}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD for fictional local users}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-4200}
      FRONTEND_ALT_ORIGIN: http://127.0.0.1:${FRONTEND_PORT:-4200}
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
    volumes:
      - ./infra/keycloak/procureflow-realm.json:/opt/keycloak/data/import/procureflow-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The upstream image intentionally contains no curl/wget.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 36
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  rabbitmq-data:
