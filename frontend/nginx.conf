worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA submits only small JSON documents (title max 200 characters, justification max
    # 2000); 64k is a hard edge bound. The application enforces its own stricter JSON limit on
    # every port, including this proxied path and the directly published application port.
    client_max_body_size 64k;

    # script-src stays 'self' because the production build has no inline script: angular.json
    # disables critical-CSS inlining, so index.html loads only hashed same-origin files. Angular
    # still injects component styles as <style> elements at runtime, which needs 'unsafe-inline'
    # for styles only. connect-src additionally allows loopback Keycloak origins because
    # keycloak-js refreshes tokens with a cross-origin fetch to the configurable local port; a
    # non-loopback deployment must pin its exact issuer origin here instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health { access_log off; return 200 'ok'; }
    location /api/ { proxy_pass http://app:8080; }
    location /v3/api-docs { proxy_pass http://app:8080; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
